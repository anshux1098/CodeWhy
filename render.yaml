services:
  - type: web
    name: codewhy-api
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATA_SOURCE
        value: graph
      - key: SQLITE_CACHE_PATH
        value: data/ingest.sqlite3
      - key: OFFLINE
        value: "false"

  - type: web
    name: codewhy-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://codewhy-ho8u.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
