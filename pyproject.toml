[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codewhy"
version = "0.1.0"
description = "Answers why code is the way it is, from reconstructed engineering history."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.32",
    "neo4j>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
]
embeddings = [
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
addopts = "-q --durations=15"
# A test that reaches the network will hang rather than fail, because the timeout
# only fires once the call gives up. Sixty seconds is far longer than any
# in-process test needs and short enough that a hang is reported, not waited out.
timeout = 60
markers = [
    "live: hits the real GitHub API. Skipped unless RUN_LIVE=1.",
]
